[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosync"
version = "0.1.0"
description = "AWEAR EEG-driven Spotify playback: focus vs calming playlists"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "pytz>=2023.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "mne>=1.6",
  "python-dotenv>=1.0",
  "spotipy>=2.23",
]

[project.scripts]
neurosync = "neurosync.main:run"

[tool.setuptools.packages.find]
where = ["src"]
